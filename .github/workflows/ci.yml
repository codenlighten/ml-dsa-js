name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Node 18 is unsupported: it has no global `crypto`, so the CSPRNG
        # behind random keygen is unavailable. See engines.node in package.json.
        node: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type-check declarations
        run: npm run check:types

      - name: Test
        run: npm test

  dist-in-sync:
    name: Committed dist matches src
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild
        run: npm run build

      # dist/ is committed and served verbatim by jsDelivr's GitHub mode, so
      # drift between src/ and dist/ ships stale code to CDN consumers.
      # --porcelain also catches build outputs that were never committed.
      - name: Fail if dist/ drifted from src/
        run: |
          drift="$(git status --porcelain -- dist)"
          if [ -n "$drift" ]; then
            echo "$drift"
            git diff -- dist | head -100
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi
